apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: food-review-stg
resources:
  - ../../base
  - ingress.yaml
patches:
  - path: configmap-patch.yaml
# Secret provisioned out-of-band — see README "Bootstrap secrets".
images:
  - name: food-review-backend
    newTag: stg
replicas:
  - name: food-review-backend
    count: 2
